services:
  postgis:
    image: postgis/postgis:17-3.6-alpine
    container_name: estres-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estres}
      POSTGRES_USER: ${POSTGRES_USER:-estres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estres_dev}
    ports:
      - "${POSTGIS_BIND:-127.0.0.1}:${POSTGIS_HOST_PORT:-5433}:5432"
    volumes:
      - estres_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estres -d estres"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  estres_postgis_data:
